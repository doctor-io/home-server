[server]
# Use system hostname (set via hostnamectl)
domain-name=local

# Exclude virtual/internal interfaces — works on any machine
deny-interfaces=docker0,lo

# Do not monitor IFF_RUNNING flag — prevents spurious restarts
# on WiFi due to driver inconsistencies during power save / roaming
use-iff-running=no

# IPv4 only — avoids binding to Docker bridge IPv6 link-local addresses
use-ipv6=no

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
